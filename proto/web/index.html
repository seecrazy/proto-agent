<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTO 控制台</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --panel2: #1c2330; --border: #2a3342;
    --text: #dce3ec; --dim: #8b96a5; --accent: #4f8cff; --good: #3fb96b;
    --warn: #e0a23c; --bad: #e05c5c; --chip: #232d3f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header .logo { font-weight: 700; font-size: 16px; letter-spacing: 1px; }
  header .logo span { color: var(--accent); }
  header .meta { color: var(--dim); font-size: 12px; }
  header .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.ok { background: var(--good); } .dot.bad { background: var(--bad); }
  header .spacer { flex: 1; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 400px; min-height: 0; }

  /* ---- 左：对话 ---- */
  #chat { display: flex; flex-direction: column; border-right: 1px solid var(--border); min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 8px 12px; border-radius: 10px; white-space: pre-wrap; line-height: 1.55; }
  .msg.owner { align-self: flex-end; background: #24457a; }
  .msg.agent { align-self: flex-start; background: var(--panel2); }
  .msg.system { align-self: center; background: transparent; color: var(--warn); font-size: 12px; }
  #composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  #composer input { flex: 1; }

  /* ---- 右：仪表 ---- */
  #side { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
  .card h3 { font-size: 12px; color: var(--dim); font-weight: 600; margin-bottom: 8px; letter-spacing: .5px; }
  .param { margin-bottom: 8px; }
  .param .row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 2px; }
  .param .name { color: var(--text); } .param .val { color: var(--dim); font-variant-numeric: tabular-nums; }
  .bar { position: relative; height: 6px; background: #0b0e13; border-radius: 3px; }
  .bar .fill { position: absolute; height: 100%; border-radius: 3px; background: var(--accent); }
  .bar .setpoint { position: absolute; top: -2px; width: 2px; height: 10px; background: var(--dim); }
  .bar .threshold { position: absolute; top: -2px; width: 2px; height: 10px; background: var(--warn); }
  .badge { font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--chip); color: var(--dim); margin-left: 5px; }
  .badge.lock { color: var(--warn); } .badge.hot { color: var(--bad); } .badge.zzz { color: #7f8ea3; }
  .param.clickable { cursor: pointer; }
  .param .actions { visibility: hidden; }
  .param:hover .actions { visibility: visible; }
  .actions button { font-size: 10px; padding: 1px 6px; }

  .proposal { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; background: var(--panel2); }
  .proposal .desc { margin-bottom: 8px; line-height: 1.5; }
  .proposal .btns { display: flex; gap: 8px; }

  #audit { font-size: 11px; line-height: 1.7; max-height: 200px; overflow-y: auto; color: var(--dim); }
  #audit .t { color: var(--accent); }
  .kv { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .kv input[type=text] { flex: 1; }
  input {
    background: #0b0e13; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; font-size: 13px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  .empty { color: var(--dim); font-size: 12px; padding: 6px 0; }
</style>
</head>
<body>
<header>
  <div class="logo">PROTO<span>·</span>console</div>
  <div class="meta" id="model">…</div>
  <div class="meta">审计链 <span class="dot ok" id="chain-dot"></span></div>
  <div class="spacer"></div>
  <button id="mute-btn" onclick="toggleMute()">静音</button>
</header>

<main>
  <section id="chat">
    <div id="messages"></div>
    <div id="composer">
      <input id="chat-input" placeholder="对 PROTO 说点什么…（反馈会塑造它的倾向）" onkeydown="if(event.key==='Enter')sendChat()">
      <button class="primary" onclick="sendChat()">发送</button>
    </div>
  </section>

  <aside id="side">
    <div class="card">
      <h3>内在状态 <span style="float:right" id="emo"></span></h3>
      <div id="params"></div>
      <div class="empty" style="margin-top:6px">点击参数名 → 锁定/解锁（🔒=锁定 ❄=休眠 ! =缺口超阈值）</div>
    </div>

    <div class="card">
      <h3>主人优先级（目标仲裁对齐项）</h3>
      <div class="kv">
        <input type="text" id="priority-input" placeholder="例：补齐支付模块的单元测试">
        <button onclick="savePriority()">保存</button>
      </div>
    </div>

    <div class="card">
      <h3>待审批的主动提议</h3>
      <div id="proposals"><div class="empty">（暂无）</div></div>
    </div>

    <div class="card">
      <h3>指派任务</h3>
      <div class="kv">
        <input type="text" id="task-input" placeholder="例：看看现在几点">
        <button class="primary" onclick="runTask()">执行</button>
      </div>
      <div id="task-result" class="empty"></div>
    </div>

    <div class="card">
      <h3>审计链（最近 20 条）</h3>
      <div id="audit"></div>
    </div>
  </aside>
</main>

<script>
const TOKEN = (location.hash.match(/token=([^&]+)/) || [])[1] || "";
if (!TOKEN) document.body.innerHTML = "<p style='padding:30px'>缺少访问令牌：请使用终端打印的完整 URL（含 #token=…）打开。</p>";

async function api(method, path, body) {
  const resp = await fetch(path, {
    method, headers: { "X-Proto-Token": TOKEN,
                       ...(body ? {"Content-Type": "application/json"} : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (resp.status === 401) { addMsg("令牌失效，请用终端里的完整 URL 重新打开。", "system"); throw new Error("unauthorized"); }
  return resp.json();
}

function addMsg(text, who) {
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById("chat-input");
  const text = input.value.trim(); if (!text) return;
  input.value = "";
  addMsg(text, "owner");
  try {
    const data = await api("POST", "/api/chat", { text });
    addMsg(data.reply, "agent");
    if (data.proposal) addMsg(data.proposal, "system");
    refreshSide();
  } catch (e) { /* 已提示 */ }
}

async function refreshState() {
  const s = await api("GET", "/api/state");
  document.getElementById("model").textContent = s.model;
  document.getElementById("chain-dot").className = "dot " + (s.chain_ok ? "ok" : "bad");
  document.getElementById("mute-btn").textContent = s.muted ? "解除静音" : "静音";
  document.getElementById("emo").textContent =
    `P${s.emotion.pleasure} A${s.emotion.arousal} D${s.emotion.dominance}`;
  if (document.activeElement !== document.getElementById("priority-input"))
    document.getElementById("priority-input").value = s.owner_priority || "";

  const box = document.getElementById("params");
  box.innerHTML = "";
  const cats = { instincts: "本能", desires: "欲望缺口", personality: "性格" };
  for (const [cat, label] of Object.entries(cats)) {
    const h = document.createElement("div");
    h.style.cssText = "color:var(--dim);font-size:11px;margin:8px 0 4px";
    h.textContent = label;
    box.appendChild(h);
    for (const p of s.params[cat]) renderParam(box, p, cat);
  }
}

function renderParam(box, p, cat) {
  const [lo, hi] = p.bounds;
  const pct = v => ((v - lo) / (hi - lo) * 100).toFixed(1);
  const div = document.createElement("div");
  div.className = "param clickable";
  const badges =
    (p.owner_locked ? '<span class="badge lock">🔒</span>' : "") +
    (p.dormant ? '<span class="badge zzz">❄休眠</span>' : "") +
    (p.threshold !== undefined && p.value >= p.threshold ? '<span class="badge hot">!超阈值</span>' : "");
  div.innerHTML = `
    <div class="row">
      <span class="name" title="点击锁定/解锁">${p.name}${badges}
        <span class="actions">
          <button onclick="toggleLock('${cat}.${p.name}', ${p.owner_locked})">${p.owner_locked ? "解锁" : "锁定"}</button>
          <button onclick="override('${cat}.${p.name}', ${lo})">↓</button>
          <button onclick="override('${cat}.${p.name}', ${hi})">↑</button>
        </span>
      </span>
      <span class="val">${p.value}</span>
    </div>
    <div class="bar">
      <div class="fill" style="left:0;width:${pct(p.value)}%"></div>
      <div class="setpoint" style="left:${pct(p.setpoint)}%"></div>
      ${p.threshold !== undefined ? `<div class="threshold" style="left:${pct(p.threshold)}%"></div>` : ""}
    </div>`;
  box.appendChild(div);
}

async function toggleLock(param, locked) {
  await api("POST", "/api/lock", { param, on: !locked });
  refreshState();
}
async function override(param, value) {
  const r = await api("POST", "/api/override", { param, value });
  addMsg(`主人覆写 ${r.param} → ${r.value}${r.clamped ? "（已截断到边界）" : ""}`, "system");
  refreshState();
}
async function savePriority() {
  const text = document.getElementById("priority-input").value.trim();
  await api("POST", "/api/priority", { text });
  addMsg(`主人优先级已更新：「${text}」——目标仲裁将优先对齐它。`, "system");
}
async function toggleMute() {
  const s = await api("GET", "/api/state");
  const r = await api("POST", "/api/mute", { on: !s.muted });
  document.getElementById("mute-btn").textContent = r.muted ? "解除静音" : "静音";
}
async function runTask() {
  const input = document.getElementById("task-input");
  const text = input.value.trim(); if (!text) return;
  input.value = "";
  addMsg(`〔任务〕${text}`, "owner");
  const r = await api("POST", "/api/task", { text });
  document.getElementById("task-result").textContent =
    r.status === "no_plan" ? r.reason : `${r.status}: ${JSON.stringify(r.step_results || r.proposal_id)}`;
  addMsg(`任务 ${r.status}。`, "agent");
}

async function refreshProposals() {
  const data = await api("GET", "/api/proposals");
  const box = document.getElementById("proposals");
  box.innerHTML = "";
  if (!data.proposals.length) { box.innerHTML = '<div class="empty">（暂无——欲望缺口×调度器会驱动它主动提议）</div>'; return; }
  for (const p of data.proposals) {
    const div = document.createElement("div");
    div.className = "proposal";
    div.innerHTML = `
      <div class="desc">${p.description}<br><span class="badge">${p.desire_dim || ""}</span></div>
      <div class="btns">
        <button class="primary" onclick="decide('${p.proposal_id}','accept')">同意（产出草稿）</button>
        <button class="danger" onclick="decide('${p.proposal_id}','deny')">拒绝（触发阻尼）</button>
      </div>`;
    box.appendChild(div);
  }
}

async function decide(id, action) {
  const r = await api("POST", `/api/proposals/${id}/${action}`, {});
  addMsg(action === "accept"
    ? `已同意，执行 ${r.status}（草稿在 proto_data/ws/scratch/）`
    : `已拒绝，触发阈值上调至 ${r.threshold}（阻尼生效）`, "system");
  refreshProposals();
  refreshState();
}

async function refreshAudit() {
  const data = await api("GET", "/api/audit?n=20");
  const box = document.getElementById("audit");
  box.innerHTML = data.events.slice().reverse()
    .map(e => `<div><span class="t">#${e.seq}</span> ${e.event_type} <span style="opacity:.6">${esc(JSON.stringify(e.payload)).slice(0, 80)}</span></div>`)
    .join("");
}
function esc(s) { const d = document.createElement("i"); d.textContent = s; return d.innerHTML; }

(async function loop() {
  try {
    await api("POST", "/api/tick", {});   // 驱动欲望动态/调度器
    await refreshState(); await refreshProposals(); await refreshAudit();
  } catch (e) {}
  setTimeout(loop, 8000);
})();
addMsg("PROTO 控制台已就绪。直接说话即可；你的反馈会经归因累积、有界地塑造它的倾向。", "system");
</script>
</body>
</html>
